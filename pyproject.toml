[project]
name = "tangoflux-modal-lab"
version = "0.1.0"
description = "Modal environment and research utilities for TangoFlux generation, activation patching, and steering."
requires-python = ">=3.11"
dependencies = [
  "modal>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]
# Local (CPU) analysis deps for the linear-probe trainer. Heavy ML/audio deps
# stay inside the Modal image; these run on the captured feature vectors.
analysis = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
