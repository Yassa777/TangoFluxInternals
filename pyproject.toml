[project]
name = "tangoflux-modal-lab"
version = "0.1.0"
description = "Modal environment and research utilities for TangoFlux generation, activation patching, and steering."
requires-python = ">=3.11"
dependencies = [
  "modal>=1.4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
